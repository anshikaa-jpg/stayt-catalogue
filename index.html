function photo(p){if(p.photoPending&&!p.image)return '<div class="photo-pending" role="img" aria-label="Photo pending"><span>📷</span><b>Photo pending</b></div>';return p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy" decoding="async" data-fallback="'+esc(p.emoji||"🎩")+'">':'<span class="emoji" aria-hidden="true">'+esc(p.emoji||"🎩")+'</span>'}
function renderTabs(){document.getElementById("filters").innerHTML=requests.filter(r=>r.id==="magicians").map(r=>'<button class="filter '+(r.id===activeRequest?'active':'')+'" data-request="'+esc(r.id)+'">'+esc(r.title)+' <span style="opacity:.75">('+r.items.length+')</span></button>').join("");}
function render(){const req=requests.find(r=>r.id===activeRequest);if(!req){grid.innerHTML="";empty.style.display="block";return}document.getElementById("categoryTitle").textContent=req.id==="magicians"?"Magicians":req.title;document.getElementById("categorySubtitle").textContent=req.id==="magicians"?"31 October 2026 · 8:00 PM · Purva Skywood, Harlur · Adults · ₹6,000 target":(req.subtitle||"Options selected for you.");const q=search.value.trim().toLowerCase();let list=req.items.filter(p=>[p.name,p.description,p.status,req.title,...(p.features||[]),...(p.pending||[])].join(" ").toLowerCase().includes(q));if(sort.value==="priceAsc")list.sort((a,b)=>(a.priceValue??Infinity)-(b.priceValue??Infinity));if(sort.value==="priceDesc")list.sort((a,b)=>(b.priceValue??-Infinity)-(a.priceValue??-Infinity));if(sort.value==="nameAsc")list.sort((a,b)=>a.name.localeCompare(b.name));if(sort.value==="heightDesc")list.sort((a,b)=>(b.heightCm??-1)-(a.heightCm??-1));const action=(url,label)=>url?'<a class="mini-action" href="'+esc(url)+'" '+(url.startsWith("tel:")?'':'target="_blank" rel="noopener"')+'>'+esc(label)+'</a>':"";grid.innerHTML=list.map(p=>'<article class="card" data-card-id="'+p.id+'"><div class="photo" data-photo="'+p.id+'" role="button" tabindex="0" aria-label="Open '+esc(p.name)+' details">'+photo(p)+'<span class="tag">'+esc(p.tag||req.title)+'</span></div><div class="body"><h3>'+esc(p.name)+'</h3><p class="desc">'+esc(p.description)+'</p><div class="status-line">'+esc(p.status||"Status pending")+'</div><div class="price-row"><span class="price">'+esc(p.price)+'</span><span class="unit">'+esc(p.unit||"")+'</span></div><div class="card-actions">'+action(p.phone?"tel:"+p.phone:"",p.phone?"Call · "+p.phone:"")+action(p.instagram,"Instagram")+action(p.website,"Website")+action(p.id===306?p.detailsUrl:"",p.id===306?"Reddit post":"")+'</div><button class="btn" data-details="'+p.id+'">Full profile & demos ↗</button></div></article>').join("");empty.style.display=list.length?"none":"block";grid.style.display=list.length?"grid":"none";}
function details(id){let p=null,req=null;for(const r of requests){const found=r.items.find(x=>x.id===+id);if(found){p=found;req=r;break}}if(!p)return;const modalPhoto=document.getElementById("modalPhoto");modalPhoto.innerHTML=photo(p);modalPhoto.classList.toggle("pending-photo",!!p.photoPending&&!p.image);document.getElementById("modalCategory").textContent=req.title;document.getElementById("modalTitle").textContent=p.name;document.getElementById("modalPrice").textContent=p.price;document.getElementById("modalOld").textContent="";document.getElementById("modalDesc").textContent=p.description;document.getElementById("modalFeatures").innerHTML=(p.features||[]).map(f=>"<li>"+esc(f)+"</li>").join("")+((p.pending||[]).length?'<li><b>Still to confirm:</b><ul>'+p.pending.map(f=>"<li>"+esc(f)+"</li>").join("")+"</ul></li>":"");const links=document.getElementById("modalLinks");links.innerHTML="";const addLink=(url,label)=>{if(!url)return;const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent=label;links.appendChild(a)};addLink(p.phone?"tel:"+p.phone:"","Call "+(p.phone||""));if(p.phoneAlt)addLink("tel:"+p.phoneAlt,"Alternate phone");addLink(p.instagram,"Instagram profile");addLink(p.website,"Website");addLink(p.detailsUrl,"Profile / details");(p.extraLinks||[]).forEach(([url,label])=>addLink(url,label));(p.videoUrls||[]).forEach((url,i)=>{const wrap=document.createElement("div");wrap.className="video-wrap";const frame=document.createElement("iframe");frame.src=url;frame.title=p.name+" demo video "+(i+1);frame.loading="lazy";frame.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";frame.allowFullscreen=true;wrap.appendChild(frame);links.appendChild(wrap);const watch=document.createElement("a");watch.href=url.replace("/embed/","/watch?v=");watch.target="_blank";watch.rel="noopener";watch.textContent="Watch demo on YouTube ↗";watch.className="video-fallback";links.appendChild(watch)});document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden";}
function closeModal(){document.getElementById("modal").classList.remove("open");document.body.style.overflow="";}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("[data-request]");if(!b)return;activeRequest=b.dataset.request;search.value="";sort.value="recommended";renderTabs();render()});search.addEventListener("input",render);sort.addEventListener("change",render);grid.addEventListener("click",e=>{const b=e.target.closest("[data-details]");const ph=e.target.closest("[data-photo]");if(b)details(b.dataset.details);else if(ph)details(ph.dataset.photo)});grid.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-photo]")){e.preventDefault();details(e.target.dataset.photo)}});document.addEventListener("error",e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.fallback)return;const fallback=document.createElement("div");fallback.className="photo-pending";fallback.setAttribute("role","img");fallback.setAttribute("aria-label","Photo pending");fallback.innerHTML="<span>📷</span><b>Photo pending</b>";img.replaceWith(fallback);},true);document.getElementById("close").addEventListener("click",closeModal);document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});renderTabs();render();
</script>
</body></html>
