<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F28C2A">
<title>STAYT | Your Home Options</title>
<style>
:root{--orange:#F28C2A;--ink:#262321;--muted:#756e68;--line:#eee6df;--cream:#fff7ef;--soft:#fffaf6}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(10px);z-index:5}.logo{font-family:Georgia,serif;font-size:37px;font-weight:bold;letter-spacing:-2px;color:#e96d35;text-decoration:none}.top small{color:var(--muted);font-size:13px}.hero{margin:22px auto 0;width:calc(100% - 36px);max-width:1240px;border-radius:25px;background:var(--cream);display:grid;grid-template-columns:1.2fr .8fr;overflow:hidden;min-height:280px}.hero-copy{padding:clamp(28px,5vw,64px);align-self:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#d96e12}.hero h1{font-size:clamp(34px,4.7vw,58px);line-height:1.04;letter-spacing:-2px;margin:14px 0}.hero h1 span{color:var(--orange)}.hero p{line-height:1.7;color:#655e57;max-width:510px;margin:0;font-size:16px}.hero-art{background:linear-gradient(140deg,#f8dfc9,#f7a45e);display:grid;place-items:center;min-height:250px}.art-card{width:min(260px,78%);padding:28px 22px;text-align:center;background:#fff9f1e8;border:1px solid #fff;border-radius:25px;transform:rotate(2deg);box-shadow:0 20px 45px #a65b2820}.art-card .symbol{font-size:64px}.art-card b{display:block;font-size:18px;margin:8px 0}.art-card span{font-size:13px;color:#75675a}.wrap{width:calc(100% - 36px);max-width:1240px;margin:42px auto 60px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}.section-head h2{font-size:clamp(27px,3vw,37px);letter-spacing:-1.4px;margin:7px 0}.section-head p{font-size:14px;color:var(--muted);margin:0}.tools{display:flex;gap:9px}.search,.sort{min-width:0;border:1px solid var(--line);border-radius:999px;padding:13px 15px;background:#fff;font-size:13px;outline:none}.search:focus,.sort:focus{border-color:var(--orange)}.search{width:220px}.sort{max-width:220px}.filters{display:flex;gap:9px;overflow-x:auto;padding:2px 0 17px;margin-bottom:7px}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:11px 17px;background:#fff;font-size:13px;font-weight:750;color:#5c554e;cursor:pointer}.filter.active{background:var(--orange);border-color:var(--orange);color:#fff}.count{font-size:12px;color:var(--muted);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}.card{max-width:560px;width:100%;justify-self:center}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;background:#fff;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px #43210d0c}.photo{height:300px;position:relative;background:linear-gradient(135deg,#fbefe3,#f5d0ac);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}.photo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}.photo:has(img){background:#fffaf6}.emoji{font-size:72px}.tag{position:absolute;top:12px;left:12px;background:#fff;color:#8d4c1d;border-radius:7px;padding:7px 9px;font-size:10px;font-weight:800;box-shadow:0 2px 10px #4c2c1610}.body{padding:17px;display:flex;flex-direction:column;gap:9px;flex:1}.body h3{font-size:17px;margin:0}.desc{font-size:13px;color:var(--muted);line-height:1.55;margin:0}.features{padding-left:17px;margin:0;font-size:12px;line-height:1.8;color:#56514c}.price-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-top:auto;padding-top:7px}.price{font-size:21px;color:#df6816;font-weight:800}.old{font-size:12px;color:#9a9189;text-decoration:line-through}.unit{font-size:11px;color:var(--muted)}.btn{border:1px solid #f1c49d;border-radius:999px;background:#fff8f1;color:#9b4d13;font-weight:750;padding:11px 14px;cursor:pointer;font-size:12px;margin-top:6px}.btn:hover{background:#fff0e1}.empty{display:none;text-align:center;color:var(--muted);padding:35px}.modal{display:none;position:fixed;inset:0;z-index:10;background:#1c1712a8;align-items:center;justify-content:center;padding:16px;overflow:hidden}.modal.open{display:flex}.modalbox{width:min(560px,calc(100vw - 32px));max-width:560px;height:auto;max-height:90vh;overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:20px;position:relative;flex:0 1 560px}.close{position:absolute;right:10px;top:10px;z-index:2;border:0;background:#fff;border-radius:50%;font-size:25px;width:38px;height:38px;cursor:pointer}.modalphoto{height:clamp(180px,35vh,320px);min-height:0;max-height:35vh;display:flex;align-items:center;justify-content:center;background:var(--cream);font-size:75px;overflow:hidden;flex-shrink:0}.modalphoto img{display:block;width:100%;height:100%;max-height:100%;object-fit:contain;object-position:center}.modalbody{padding:22px}.modalbody h2{margin:8px 0}.modalbody p{color:var(--muted);line-height:1.6;font-size:14px}.modalbody a{display:inline-block;color:#c85e10;margin:8px 12px 0 0;font-weight:bold}.foot{text-align:center;padding:24px;color:#888;font-size:11px;border-top:1px solid var(--line)}.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:11px;color:#6b625b}.pill i{width:7px;height:7px;background:#61a878;border-radius:50%}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{max-width:none}.photo{height:clamp(220px,42vw,330px);padding:8px}.top{height:62px;padding:0 18px}.logo{font-size:33px}.hero{grid-template-columns:1fr;width:calc(100% - 24px);margin-top:12px}.hero-art{min-height:190px}.art-card{padding:18px 24px}.art-card .symbol{font-size:48px}.wrap{width:calc(100% - 24px);margin-top:30px}.section-head{align-items:stretch;flex-direction:column}.tools{display:grid;grid-template-columns:1fr 1fr}.search{width:100%}.sort{width:100%;max-width:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.photo{height:165px}.body{padding:12px;gap:8px}.body h3{font-size:14px}.desc{font-size:12px}.price{font-size:19px}.features{font-size:11px}.top small{display:none}}
@media(max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:clamp(205px,56vw,290px);padding:6px}.hero h1{font-size:35px}.hero p{font-size:14px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo{height:135px}.emoji{font-size:51px}.tag{top:8px;left:8px;padding:6px 7px;font-size:9px}.body{padding:10px}.body h3{font-size:13px}.features{padding-left:14px}.btn{padding:10px;font-size:11px}.section-head p{line-height:1.5}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#" aria-label="STAYT">STAYT</a><small>Your home, handled.</small></header>

<main class="wrap" id="catalogue"><div class="section-head"><div><div class="eyebrow">Curated for you</div><h2 id="pageTitle">Karishma's options</h2><p>Browse each request using the tabs below.</p></div><div class="pill"><i></i> Prepared by your STAYT team</div></div>
<div class="filters" id="filters" aria-label="Catalogue categories"></div>
<div class="section-head" style="margin:6px 0 15px;align-items:center"><div><h2 id="categoryTitle" style="font-size:22px;margin:0 0 4px">Plants</h2><p id="categorySubtitle">A few options to get you started.</p></div><div class="tools"><input id="search" class="search" type="search" placeholder="Search these options…" aria-label="Search options"><select id="sort" class="sort" aria-label="Sort options"><option value="recommended">Sort: Recommended</option><option value="priceAsc">Price: low to high</option><option value="priceDesc">Price: high to low</option><option value="nameAsc">Name: A–Z</option><option value="heightDesc">Height: tallest first</option></select></div></div>
<div class="grid" id="grid"></div><div class="empty" id="empty">No matching options found. Try another search.</div></main>
<footer class="foot">STAYT · Your home, handled.</footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalbox"><button class="close" id="close" aria-label="Close">×</button><div class="modalphoto" id="modalPhoto">✨</div><div class="modalbody"><div class="eyebrow" id="modalCategory"></div><h2 id="modalTitle"></h2><div class="price-row"><span class="price" id="modalPrice"></span><span class="old" id="modalOld"></span></div><p id="modalDesc"></p><ul class="features" id="modalFeatures"></ul><div id="modalLinks"></div></div></div></div>
<script>
/*
  CATALOGUE CONTENT: this is the section your STAYT team customizes for each customer.
  Each customer page can have its own customerName and requests. Cards support image, price,
  description, features, heightCm, detailsUrl and videoUrl. Remove a request when complete.
  This first version is a visual prototype; content is currently stored in this page's code.
*/
const customerName = "Karishma";
const requests = [
 {id:"plants",title:"Plants",subtitle:"Nine plant options from the STAYT plant catalogue.",items:[
{id:101,name:"Ficus Moclame Plant",tag:"Option 1",price:"₹2,299",oldPrice:"₹5,999",priceValue:2299,unit:"per plant",emoji:"🪴",image:"https://www.ugaoo.com/cdn/shop/files/Ficus_Moclame_Plant_72x-100.jpg?v=1741697026",description:"A lush indoor plant with dense, glossy green foliage.",features:["Dense, glossy green foliage","Great air-purifying indoor plant","Low maintenance and easy to grow","Adds a lush look to any corner"],heightCm:90,detailsUrl:"",videoUrl:""},
{id:102,name:"Thuja Plant - XL",tag:"Option 2",price:"₹1,499",oldPrice:"₹1,800",priceValue:1499,unit:"per plant",emoji:"🌲",image:"https://www.ugaoo.com/cdn/shop/files/Thuja_Plant_72x-100.jpg",description:"An evergreen conical plant for indoor or balcony decor.",features:["Evergreen conical shape","Ideal for indoor or balcony decor","Low water requirement","Adds a fresh, forest-like feel"],heightCm:100,detailsUrl:"",videoUrl:""},
{id:103,name:"Netted Ficus Tree",tag:"Option 3",price:"₹4,499",oldPrice:"₹4,999",priceValue:4499,unit:"per plant",emoji:"🌳",image:"https://www.ugaoo.com/cdn/shop/products/netted-ficus-tree-32169816686724.jpg?v=1675560431",description:"An elegant ficus with a distinctive braided trunk.",features:["Elegant braided trunk design","Statement piece for living spaces","Low maintenance evergreen","Great gifting option"],heightCm:100,detailsUrl:"",videoUrl:""},
{id:104,name:"Sansevieria Laurentii",tag:"Option 4",price:"₹1,499",oldPrice:"₹2,000",priceValue:1499,unit:"per plant",emoji:"🌿",image:"https://www.ugaoo.com/cdn/shop/files/Sansevieria_Laurentii_Plant_72x-100.jpg?v=1769688953",description:"A striking plant with tall, sword-shaped leaves.",features:["Tall, striking sword-shaped leaves","Excellent air-purifying qualities","Thrives in low light","Extremely low maintenance"],heightCm:80,detailsUrl:"",videoUrl:""},
{id:105,name:"Monstera Deliciosa Plant",tag:"Option 5",price:"₹1,259",oldPrice:"₹1,849",priceValue:1259,unit:"per plant",emoji:"🍃",image:"https://www.ugaoo.com/cdn/shop/files/Monstera_Deliciosa_Plant_72x-100.jpg",description:"A designer-favourite plant with iconic split-leaf foliage.",features:["Designers' favourite statement plant","Iconic split-leaf foliage","Thrives in bright, indirect light","Adds a tropical touch to decor"],heightCm:55,detailsUrl:"",videoUrl:""},
{id:106,name:"Monstera Deliciosa Plant - XL",tag:"Option 6",price:"₹2,499",oldPrice:"₹3,000",priceValue:2499,unit:"per plant",emoji:"🌱",image:"https://www.ugaoo.com/cdn/shop/files/Monstera_Deliciosa_Plant_-_XL_7_copy_7_2.jpg?v=1769688455",description:"An extra-large monstera with bold tropical foliage.",features:["Extra-large split-leaf foliage","Bold tropical statement piece","Thrives in bright, indirect light","Perfect for spacious interiors"],heightCm:100,detailsUrl:"",videoUrl:""},
{id:107,name:"Bird Of Paradise Plant",tag:"Option 7",price:"₹2,499",oldPrice:"₹3,000",priceValue:2499,unit:"per plant",emoji:"🌴",image:"https://www.ugaoo.com/cdn/shop/files/Bird_Of_Paradise_Plant_72x-100_91b1f0f2-bb64-4b01-b169-ff053bf998a4.jpg?v=1771226839",description:"A tropical centrepiece with large paddle-shaped leaves.",features:["Large paddle-shaped leaves","Striking tropical centerpiece","Thrives in bright light","Adds a resort-style vibe"],heightCm:120,detailsUrl:"",videoUrl:""},
{id:108,name:"The China Doll Plant",tag:"Option 8",price:"₹1,499",oldPrice:"₹1,800",priceValue:1499,unit:"per plant",emoji:"🪴",image:"https://www.ugaoo.com/cdn/shop/files/The_China_Doll_Plant_72x-100.jpg?v=1769688241",description:"An evergreen ornamental indoor plant with glossy compound leaves.",features:["Evergreen ornamental indoor plant","Glossy compound leaves","Prefers bright, indirect light","Great for home and office decor"],heightCm:75,detailsUrl:"",videoUrl:""},
{id:109,name:"Areca Palm Plant XL",tag:"Option 9",price:"₹1,499",oldPrice:"₹1,800",priceValue:1499,unit:"per plant",emoji:"🌴",image:"https://www.ugaoo.com/cdn/shop/files/Areca_xl.jpg?v=1778932573",description:"A feathery palm that brings a tropical, resort-like feel.",features:["Feathery, fan-like fronds","Natural air purifier","Adds a tropical resort feel","Thrives in bright, indirect light"],heightCm:100,detailsUrl:"",videoUrl:""}
 ]},
 {id:"magicians",title:"Magicians",subtitle:"Performer options with space for videos and packages.",items:[
  {id:301,name:"Magician option 1",tag:"Performer",price:"Package to be confirmed",priceValue:null,unit:"per event",emoji:"🎩",image:"",description:"Add the performer's introduction, style and event suitability here.",features:["Performance duration to be added","Suitable age group and audience size","Video or profile link can be attached"],detailsUrl:"",videoUrl:""},
  {id:302,name:"Magician option 2",tag:"Performer",price:"Package to be confirmed",priceValue:null,unit:"per event",emoji:"🎭",image:"",description:"A second performer to compare by style, package and availability.",features:["Performance duration to be added","Suitable age group and audience size","Video or profile link can be attached"],detailsUrl:"",videoUrl:""}
 ]}
];
const grid=document.getElementById("grid"),search=document.getElementById("search"),sort=document.getElementById("sort"),empty=document.getElementById("empty");
let activeRequest=requests[0]?.id||"",activeItems=[];
document.getElementById("pageTitle").textContent=customerName+"'s options";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function photo(p){return p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'" loading="lazy" decoding="async" data-fallback="'+esc(p.emoji||"🏡")+'">':'<span class="emoji" aria-hidden="true">'+esc(p.emoji||"🏡")+'</span>'}
function renderTabs(){document.getElementById("filters").innerHTML=requests.filter(r=>r.id==="magicians").map(r=>'<button class="filter '+(r.id===activeRequest?'active':'')+'" data-request="'+esc(r.id)+'">'+esc(r.title)+' <span style="opacity:.75">('+r.items.length+')</span></button>').join("");}
function render(){const req=requests.find(r=>r.id===activeRequest);if(!req){grid.innerHTML="";empty.style.display="block";return}document.getElementById("categoryTitle").textContent=req.title;document.getElementById("categorySubtitle").textContent=req.subtitle||"Options selected for you.";const q=search.value.trim().toLowerCase();let list=req.items.filter(p=>[p.name,p.description,req.title,...(p.features||[])].join(" ").toLowerCase().includes(q));if(sort.value==="priceAsc")list.sort((a,b)=>(a.priceValue??Infinity)-(b.priceValue??Infinity));if(sort.value==="priceDesc")list.sort((a,b)=>(b.priceValue??-Infinity)-(a.priceValue??-Infinity));if(sort.value==="nameAsc")list.sort((a,b)=>a.name.localeCompare(b.name));if(sort.value==="heightDesc")list.sort((a,b)=>(b.heightCm??-1)-(a.heightCm??-1));grid.innerHTML=list.map(p=>'<article class="card"><div class="photo">'+photo(p)+'<span class="tag">'+esc(p.tag||req.title)+'</span></div><div class="body"><h3>'+esc(p.name)+'</h3><p class="desc">'+esc(p.description)+'</p><ul class="features">'+(p.features||[]).slice(0,3).map(f=>'<li>'+esc(f)+'</li>').join("")+'</ul><div class="price-row"><span class="price">'+esc(p.price)+'</span>'+(p.oldPrice?'<span class="old">'+esc(p.oldPrice)+'</span>':'')+'<span class="unit">'+esc(p.unit||"")+'</span></div><button class="btn" data-details="'+p.id+'">View details ↗</button></div></article>').join("");empty.style.display=list.length?"none":"block";grid.style.display=list.length?"grid":"none";}
function details(id){let p=null,req=null;for(const r of requests){const found=r.items.find(x=>x.id===+id);if(found){p=found;req=r;break}}if(!p)return;document.getElementById("modalPhoto").innerHTML=photo(p);document.getElementById("modalCategory").textContent=req.title;document.getElementById("modalTitle").textContent=p.name;document.getElementById("modalPrice").textContent=p.price;document.getElementById("modalOld").textContent=p.oldPrice||"";document.getElementById("modalDesc").textContent=p.description;document.getElementById("modalFeatures").innerHTML=(p.features||[]).map(f=>"<li>"+esc(f)+"</li>").join("");const links=document.getElementById("modalLinks");links.innerHTML="";[[p.detailsUrl,"Product / profile details"],[p.videoUrl,"Watch video ▶"]].forEach(([url,label])=>{if(url){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";a.textContent=label;links.appendChild(a)}});document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden";}
function closeModal(){document.getElementById("modal").classList.remove("open");document.body.style.overflow="";}
document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest("[data-request]");if(!b)return;activeRequest=b.dataset.request;search.value="";sort.value="recommended";renderTabs();render()});search.addEventListener("input",render);sort.addEventListener("change",render);grid.addEventListener("click",e=>{const b=e.target.closest("[data-details]");if(b)details(b.dataset.details)});document.addEventListener("error",e=>{const img=e.target;if(!(img instanceof HTMLImageElement)||!img.dataset.fallback)return;const fallback=document.createElement("span");fallback.className="emoji";fallback.setAttribute("aria-hidden","true");fallback.textContent=img.dataset.fallback;img.replaceWith(fallback);},true);document.getElementById("close").addEventListener("click",closeModal);document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});renderTabs();render();
</script>
</body></html>
